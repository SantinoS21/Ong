<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumate!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body style="background-color: #414141;">

    <main id="formulario">

        <h1>¡Sumate a nosotros!</h1>

        <p>Fecha de nacimiento</p>
        <input type="date" id="fecha" name="fecha">

        <p>¿Tenés experiencia previa en skateboarding u otro tipo de patinaje?</p>

        <input type="radio" id="experiencia-si" name="experiencia" value="si">
        <label for="experiencia-si">Sí, tengo experiencia</label>

        <input type="radio" id="experiencia-no" name="experiencia" value="no">
        <label for="experiencia-no">No, no tengo experiencia</label>

        <p>¿Tenés tabla propia?</p>

        <input type="radio" id="tabla-si" name="tabla" value="si">
        <label for="tabla-si">Sí, tengo tabla</label>

        <input type="radio" id="tabla-no" name="tabla" value="no">
        <label for="tabla-no">No, no tengo tabla</label>

        <p>¿Vivís en Quilmes?</p>

        <input type="radio" id="lugar-si" name="lugar" value="si">
        <label for="lugar-si">Sí, vivo en Quilmes</label>

        <input type="radio" id="lugar-no" name="lugar" value="no">
        <label for="lugar-no">No, vivo en otro lado</label>

        <p>¡Dejanos tu mail!</p>

        <label for="mail">Tu correo electrónico:</label>
        <input type="email" id="mail" name="mail">

        <button type="submit" id="enviar" >Enviar</button>

    </main>

</body>
    
</body>
</html>
